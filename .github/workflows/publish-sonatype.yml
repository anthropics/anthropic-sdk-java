# workflow for re-running publishing to Sonatype in case it fails for some reason
# you can run this workflow by navigating to https://www.github.com/anthropics/anthropic-sdk-java/actions/workflows/publish-sonatype.yml
name: Publish Sonatype
on:
  workflow_dispatch:

jobs:
  publish:
    name: publish
    runs-on: ${{ github.repository == 'anthropics/anthropic-sdk-java' && 'ubuntu-latest-16core' || 'ubuntu-latest-16-core' }}
    environment: production-release
    env:
      NODE_OPTIONS: --use-openssl-ca

    steps:
      - name: Set up CA certificates
        shell: sudo /usr/bin/python3 -I {0}
        run: |
          import base64, hashlib, pathlib, re, subprocess, sys

          EXCLUDED = set("""
          86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b
          bc4d809b15189d78db3e1d8cf4f9726a795da1643ca5f1358e1ddb0edc0d7eb3
          40f6af0346a99aa1cd1d555a4e9cce62c7f9634603ee406615833dc8c8d00367
          125609aa301da0a249b97a8239cb6a34216f44dcac9f3954b14292f2e8c8608f
          """.split())
          PEM = re.compile(b"-----BEGIN [A-Z0-9 ]*CERTIFICATE-----(.+?)-----END", re.S)
          SEQUENCE = bytes.fromhex("3082")

          def stop(what):
              sys.exit(
                  what + " The job stops here, before it fetches or publishes anything."
                  " If a re-run fails too, the runner image has changed and this step has to follow it."
              )

          def excluded(path):
              data = path.read_bytes()
              for blob in [data] + [base64.b64decode(body) for body in PEM.findall(data)]:
                  for match in re.finditer(SEQUENCE, blob):
                      end = match.start() + 4 + int.from_bytes(blob[match.start() + 2 : match.start() + 4], "big")
                      if hashlib.sha256(blob[match.start() : end]).hexdigest() in EXCLUDED:
                          return True
              return False

          conf = pathlib.Path("/etc/ca-certificates.conf")
          source = pathlib.Path("/usr/share/ca-certificates")
          store = pathlib.Path("/etc/ssl/certs")

          lines = conf.read_text().splitlines(keepends=True)
          for i, line in enumerate(lines):
              file = source / line.strip()
              if line.strip() and line[0] not in "#!" and file.is_file() and excluded(file):
                  lines[i] = "!" + line
          conf.write_text("".join(lines))
          for arguments in ([], ["--fresh"]):
              run = subprocess.run(["update-ca-certificates", *arguments], capture_output=True)
              if run.returncode or b"exited with code" in run.stdout + run.stderr:
                  stop("update-ca-certificates failed.")

          for file in [*store.rglob("*"), pathlib.Path("/etc/ssl/cert.pem")]:
              if file.is_file() and excluded(file):
                  stop("A file under /etc/ssl still holds an excluded CA certificate.")
          print(len(PEM.findall((store / "ca-certificates.crt").read_bytes())), "CA certificates")

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Set up Java's CA certificates
        run: |
          shared=/etc/ssl/certs/adoptium/cacerts
          for name in JAVA_HOME "${!JAVA_HOME_@}"; do
            security="${!name}/lib/security"
            if test -d "${!name}/jre"; then security="${!name}/jre/lib/security"; fi
            test "$security/cacerts" -ef "$shared" || sudo ln -sf "$shared" "$security/cacerts" || true
            sudo rm -f "$security/jssecacerts" || true
            if ! test "$security/cacerts" -ef "$shared" || test -e "$security/jssecacerts"; then
              echo "::error::Java's CA certificates in $security are not the runner's $shared alone, or that file is missing. The job stops here, before it publishes anything. If a re-run fails too, the runner image has changed and this step has to follow it."
              exit 1
            fi
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Publish to Sonatype
        run: |-
          export -- GPG_SIGNING_KEY_ID
          printenv -- GPG_SIGNING_KEY | gpg --batch --passphrase-fd 3 --import 3<<< "$GPG_SIGNING_PASSWORD"
          GPG_SIGNING_KEY_ID="$(gpg --with-colons --list-keys | awk -F : -- '/^pub:/ { getline; print "0x" substr($10, length($10) - 7) }')"
          ./gradlew publishAndReleaseToMavenCentral --stacktrace -PmavenCentralUsername="$SONATYPE_USERNAME" -PmavenCentralPassword="$SONATYPE_PASSWORD"
        env:
          SONATYPE_USERNAME: ${{ secrets.ANTHROPIC_SONATYPE_USERNAME || secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.ANTHROPIC_SONATYPE_PASSWORD || secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.ANTHROPIC_SONATYPE_GPG_SIGNING_KEY || secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.ANTHROPIC_SONATYPE_GPG_SIGNING_PASSWORD || secrets.GPG_SIGNING_PASSWORD }}
