name: Create releases

on:
  schedule:
    - cron: '0 5 * * *' # every day at 5am UTC
  push:
    branches:
      - main

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main' && github.repository == 'anthropics/anthropic-sdk-java'
    runs-on: ${{ github.repository == 'anthropics/anthropic-sdk-java' && 'ubuntu-latest-16core' || 'ubuntu-latest-16-core' }}
    environment: production-release

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: stainless-api/trigger-release-please@bb6677c5a04578eec1ccfd9e1913b5b78ed64c61 # v1.4.0
        id: release
        with:
          repo: ${{ github.event.repository.full_name }}
          stainless-api-key: ${{ secrets.STAINLESS_API_KEY }}

      - name: Set up Java
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Set up Gradle
        if: ${{ steps.release.outputs.releases_created }}
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Compile anthropic-java-core
        if: ${{ steps.release.outputs.releases_created }}
        run: >-
          ./gradlew
          :anthropic-java-core:compileJava
          :anthropic-java-core:compileKotlin
          :anthropic-java-core:compileTestJava
          :anthropic-java-core:compileTestKotlin
          -x test

      - name: Stop pre-GraalVM Gradle daemon
        if: ${{ steps.release.outputs.releases_created }}
        run: ./gradlew --stop

      - name: Run mock server
        if: ${{ steps.release.outputs.releases_created }}
        run: ./scripts/mock --daemon

      - name: Set up GraalVM
        if: ${{ steps.release.outputs.releases_created }}
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          java-version: 21
          distribution: graalvm-community

      - name: Generate GraalVM reachability metadata
        if: ${{ steps.release.outputs.releases_created }}
        run: >-
          ./gradlew :anthropic-java-core:test
          -x compileJava
          -x compileKotlin
          -x compileTestJava
          -x compileTestKotlin
          -PgraalvmAgent

      - name: Check generated GraalVM metadata
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          directory="anthropic-java-core/src/main/resources/META-INF/native-image"
          if [[ ! -d "$directory" || -z "$(ls -A "$directory")" ]]; then
            echo "::error::No GraalVM metadata found in $directory"
            exit 1
          fi

      - name: Publish to Sonatype
        if: ${{ steps.release.outputs.releases_created }}
        run: |-
          export -- GPG_SIGNING_KEY_ID
          printenv -- GPG_SIGNING_KEY | gpg --batch --passphrase-fd 3 --import 3<<< "$GPG_SIGNING_PASSWORD"
          GPG_SIGNING_KEY_ID="$(gpg --with-colons --list-keys | awk -F : -- '/^pub:/ { getline; print "0x" substr($10, length($10) - 7) }')"
          ./gradlew publishAndReleaseToMavenCentral --stacktrace -PmavenCentralUsername="$SONATYPE_USERNAME" -PmavenCentralPassword="$SONATYPE_PASSWORD"
        env:
          SONATYPE_USERNAME: ${{ secrets.ANTHROPIC_SONATYPE_USERNAME || secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.ANTHROPIC_SONATYPE_PASSWORD || secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.ANTHROPIC_SONATYPE_GPG_SIGNING_KEY || secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.ANTHROPIC_SONATYPE_GPG_SIGNING_PASSWORD || secrets.GPG_SIGNING_PASSWORD }}
